<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      :root {
        --bg: #09090b;
        --border: #27272a;
        --chevron: #fafafa;
        --cursor: #10b981;
        --beacon: #10b981;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --border: #e4e4e7;
          --chevron: #09090b;
          --cursor: #059669;
          --beacon: #059669;
        }
      }
    </style>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="var(--bg)" stroke="var(--border)" stroke-width="2" />

  <!-- Terminal Chevron '>' -->
  <path
    d="M 18 20 L 30 32 L 18 44"
    fill="none"
    stroke="var(--chevron)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Active Cursor '_' -->
  <line
    x1="35"
    y1="43"
    x2="47"
    y2="43"
    stroke="var(--cursor)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Status Pulse Dot -->
  <circle cx="45" cy="21" r="3.5" fill="var(--beacon)" />
</svg>
